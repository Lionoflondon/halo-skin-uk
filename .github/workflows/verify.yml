name: HALO checks

on:
  pull_request:
  push:
    branches: [main, codex/halo-stage4]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix functions --no-audit --no-fund
      - run: npm test
      - name: Check JavaScript syntax and Firebase configuration
        run: |
          node --check app.js
          node --check admin.js
          node --check delivery.js
          node --check functions/index.js
          node -e "JSON.parse(require('node:fs').readFileSync('firebase.json', 'utf8'))"
