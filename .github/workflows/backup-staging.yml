name: Configure HALO staging Firestore backups

on:
  workflow_dispatch:

concurrency:
  group: halo-staging-backup
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: halo-staging
    env:
      HALO_STAGING_PROJECT_ID: ${{ vars.HALO_STAGING_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Validate the isolated London staging database
        run: |
          test "$HALO_STAGING_PROJECT_ID" = "halo-skin-uk-stg"
          test "$HALO_STAGING_PROJECT_ID" != "halo-skin-uk"
          location="$(gcloud firestore databases describe --database='(default)' --project="$HALO_STAGING_PROJECT_ID" --format='value(locationId)')"
          test "$location" = "europe-west2"
      - name: Inspect and configure a seven-day daily backup schedule
        run: node scripts/ensure-halo-staging-backup.mjs
